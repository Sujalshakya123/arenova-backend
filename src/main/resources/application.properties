spring.application.name=arenova-backend

spring.datasource.url=jdbc:mysql://localhost:3306/database
spring.datasource.username=${undb}
spring.datasource.password=${pwdb}

#JPA CONFIGURATION

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.client.registration.google.client-id=${clientid}
spring.security.oauth2.client.registration.google.client-secret=${clientpw}
spring.security.oauth2.client.registration.google.scope=profile,email


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${myuser}
spring.mail.password=${mypw}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

arenova.contact.to=sujaruu10@gmail.com

# Prize pool model: entry-fee-funded (Option B 70/20/10) or fixed (legacy manual amounts).
# UNDO Option B: set mode=fixed and restart backend.
arenova.prize-pool.mode=entry-fee-funded
arenova.prize-pool.prize-percent=70
arenova.prize-pool.organizer-percent=20
arenova.prize-pool.platform-percent=10
arenova.prize-pool.first-place-percent=40
arenova.prize-pool.second-place-percent=30

# Tournament settlement ledger (organizer-initiated after completion).
# UNDO: set enabled=false and restart backend.
arenova.settlement.enabled=true

# Organizer reports + enhanced admin settlement filters.
# UNDO: set enabled=false and restart backend.
arenova.reports.enabled=true

# eSewa ePay v2 (sandbox defaults; override with env esewa_merchant / esewa_secret)
esewa.merchant-code=${esewa_merchant:EPAYTEST}
esewa.secret-key=${esewa_secret:8gBm/:&EnhH.1/q}
esewa.payment-url=${esewa_payment_url:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.status-url=${esewa_status_url:https://uat.esewa.com.np/api/epay/transaction/status/}
esewa.success-url=${esewa_success_url:http://localhost:5173/payment/esewa/success}
esewa.failure-url=${esewa_failure_url:http://localhost:5173/payment/esewa/failure}

